<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Reports</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --panel: #ffffff;
      --text: #20231f;
      --muted: #697064;
      --line: #dfe3d8;
      --accent: #126b58;
      --accent-soft: #e2f2ed;
      --warn: #8a5315;
      --warn-soft: #fff1da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    main {
      width: min(1800px, calc(100vw - 8px));
      margin: 8px auto 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

    .report {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 40px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgb(32 35 31 / 0.04);
    }

    .report-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcf8;
    }

    .title {
      font-weight: 700;
    }

    .details {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .comparison {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
    }

    .pane {
      min-width: 0;
    }

    .pane + .pane {
      border-top: 1px solid var(--line);
    }

    .pane-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcf8;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .pane-title.raw {
      color: var(--warn);
    }

    .pane-title.calibrated {
      color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    th,
    td {
      padding: 7px 8px;
      text-align: right;
      border-bottom: 1px solid var(--line);
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      text-align: left;
      background: var(--panel);
      font-weight: 650;
    }

    th {
      color: var(--muted);
      background: #fbfcf8;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.diff {
      background: #fff3b8;
      color: #3a2b00;
      font-weight: 750;
      box-shadow: inset 0 0 0 1px #e7c94c;
    }

    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcf8;
      color: var(--muted);
    }

    .missing {
      min-height: 160px;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      background: #fbfcf8;
      text-align: center;
    }

    .load-state {
      min-height: 32px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      main {
        width: calc(100vw - 10px);
        margin-top: 10px;
      }

      header,
      .report-head {
        display: block;
      }

      table {
        font-size: 11px;
      }

      th,
      td {
        padding: 6px 6px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Weather Reports</h1>
        <div class="meta">{{ reports|length }} reports</div>
      </div>
    </header>

    {% if not reports %}
      <div class="empty">No reports yet. Start the predictor to append records to report.jsonl.</div>
    {% endif %}

    <div id="report-list">
      {% include "_report_items.html" %}
    </div>
    <div id="load-state" class="load-state"></div>
    <div id="load-trigger"></div>
  </main>

  <script>
    const pageSize = 30;
    const reportList = document.getElementById("report-list");
    const loadState = document.getElementById("load-state");
    const loadTrigger = document.getElementById("load-trigger");
    let offset = {{ reports|length }};
    let loading = false;
    let hasMore = offset === pageSize;

    async function loadMoreReports() {
      if (loading || !hasMore) {
        return;
      }

      loading = true;
      loadState.textContent = "Loading...";

      try {
        const response = await fetch(`/api/reports/fragment?offset=${offset}&limit=${pageSize}`);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const html = (await response.text()).trim();
        if (!html) {
          hasMore = false;
          loadState.textContent = "";
          return;
        }

        reportList.insertAdjacentHTML("beforeend", html);
        const loadedCount = reportList.querySelectorAll(".report").length - offset;
        offset += loadedCount;
        hasMore = loadedCount === pageSize;
        loadState.textContent = "";
      } catch (error) {
        loadState.textContent = "Load failed. Scroll again to retry.";
      } finally {
        loading = false;
      }
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        loadMoreReports();
      }
    }, { rootMargin: "300px" });

    observer.observe(loadTrigger);
  </script>
</body>
</html>
